name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 python3-pil
      - name: Syntax and imports
        run: |
          python3 -m compileall -q anime-matrix-selector anime_matrix_selector animations tests
          python3 -c 'import anime_matrix_selector.ui.app'
          bash -n install.sh
      - name: Shellcheck
        run: shellcheck install.sh
      - name: Tests
        run: python3 -m unittest discover -v tests
      - name: Install into a staging folder
        run: |
          DESTDIR="$RUNNER_TEMP/pkg" ./install.sh --prefix /usr
          test -L "$RUNNER_TEMP/pkg/usr/bin/anime-matrix-selector"
          test -f "$RUNNER_TEMP/pkg/usr/share/anime-matrix-selector/anime_matrix_selector/ui/style.css"
          "$RUNNER_TEMP/pkg/usr/share/anime-matrix-selector/anime-matrix-selector" --help >/dev/null
          grep -q 'ExecStart=/usr/bin/asusctl' "$RUNNER_TEMP/pkg/usr/lib/systemd/user/anime-matrix.service"
